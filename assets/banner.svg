<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="Davi | DaviTech - Sites, sistemas e automações">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1a0c"/>
      <stop offset="1" stop-color="#2ea44f"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="260" rx="18" fill="url(#bg)"/>
  <text x="500" y="110" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="#ffffff">Davi | DaviTech</text>

  <g font-family="Consolas, 'Courier New', monospace" font-size="22" fill="#d7ffe0" text-anchor="middle">
    <text x="500" y="170" opacity="0">Desenvolvedor Full Stack &amp; Analista de Dados
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.02;0.23;0.25;1" values="0;1;1;0;0"/>
    </text>
    <text x="500" y="170" opacity="0">Sistemas que vendem e organizam negócios
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.25;0.27;0.48;0.5;1" values="0;0;1;1;0;0"/>
    </text>
    <text x="500" y="170" opacity="0">Cuiabá / Várzea Grande - MT
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.5;0.52;0.73;0.75;1" values="0;0;1;1;0;0"/>
    </text>
    <text x="500" y="170" opacity="0">Estudante de Análise de Sistemas - UNIVAG
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.75;0.77;0.98;1" values="0;0;1;1;0"/>
    </text>
  </g>

  <text x="500" y="225" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#ffffff" opacity="0.85">instagram.com/davitech_ti</text>
</svg>
