<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img" aria-labelledby="title desc">
  <title id="title">DaviTech TI — Identidade visual animada</title>
  <desc id="desc">Banner tecnológico azul com brilho pulsante, circuitos luminosos e frases que alternam automaticamente sobre desenvolvimento web.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07152E"/>
      <stop offset=".55" stop-color="#0B2450"/>
      <stop offset="1" stop-color="#071A36"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#45D9FF"/>
      <stop offset="1" stop-color="#2677FF"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#BFEAFF"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#168BFF" stop-opacity=".38"/>
      <stop offset="1" stop-color="#168BFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#8CCFFF" stroke-opacity=".075" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.5" fill="#8CCFFF" fill-opacity=".2"/>
    </pattern>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="600" rx="34" fill="url(#background)"/>
  <rect width="1600" height="600" rx="34" fill="url(#grid)"/>
  <ellipse cx="1330" cy="290" rx="430" ry="360" fill="url(#glow)" opacity=".65">
    <animate attributeName="opacity" values=".38;.85;.38" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="rx" values="390;455;390" dur="4.5s" repeatCount="indefinite"/>
  </ellipse>
  <path d="M1040 0H1600V600H1220C1390 430 1430 190 1040 0Z" fill="#0C3670" opacity=".22"/>

  <!-- Trilhas de circuito com fluxo luminoso -->
  <g fill="none" stroke="#36BFFF" stroke-opacity=".48" stroke-width="2">
    <path d="M1030 90H1180V145H1300"><animate attributeName="stroke-opacity" values=".18;.8;.18" dur="3.8s" repeatCount="indefinite"/></path>
    <path d="M1110 205H1215V260H1390V320"><animate attributeName="stroke-opacity" values=".7;.2;.7" dur="4.2s" repeatCount="indefinite"/></path>
    <path d="M1080 430H1200V385H1335"><animate attributeName="stroke-opacity" values=".2;.85;.2" dur="3.4s" repeatCount="indefinite"/></path>
    <path d="M1370 105V165H1470V220"><animate attributeName="stroke-opacity" values=".75;.22;.75" dur="4.6s" repeatCount="indefinite"/></path>
    <path d="M1450 420H1510V485"><animate attributeName="stroke-opacity" values=".2;.8;.2" dur="3.6s" repeatCount="indefinite"/></path>
    <path d="M1190 520H1280V475H1360"><animate attributeName="stroke-opacity" values=".8;.2;.8" dur="4s" repeatCount="indefinite"/></path>
  </g>
  <g fill="#5DDAFF" filter="url(#softGlow)">
    <circle cx="1300" cy="145" r="5"><animate attributeName="r" values="3;7;3" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="1390" cy="320" r="5"><animate attributeName="r" values="5;8;5" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="1335" cy="385" r="5"><animate attributeName="r" values="3;7;3" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="1470" cy="220" r="5"><animate attributeName="r" values="5;8;5" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="1510" cy="485" r="5"><animate attributeName="r" values="3;7;3" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="1360" cy="475" r="5"><animate attributeName="r" values="5;8;5" dur="3.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Símbolo da marca -->
  <g transform="translate(145 145)">
    <rect x="0" y="0" width="176" height="176" rx="38" fill="#0D2E5B" stroke="#3CBFFF" stroke-opacity=".65" stroke-width="2">
      <animate attributeName="stroke-opacity" values=".35;.95;.35" dur="3.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="10" y="10" width="156" height="156" rx="30" fill="none" stroke="#72DFFF" stroke-opacity=".18"/>
    <path d="M68 48L35 88L68 128" fill="none" stroke="url(#accent)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M108 48L141 88L108 128" fill="none" stroke="url(#accent)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M98 39L78 137" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity=".95"/>
    <circle cx="88" cy="88" r="5" fill="#FFFFFF"><animate attributeName="opacity" values=".45;1;.45" dur="2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Identidade principal -->
  <text x="370" y="225" fill="url(#word)" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="88" font-weight="800" letter-spacing="-3">DAVI<tspan fill="#48CFFF">TECH</tspan></text>
  <text x="378" y="278" fill="#8CDFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" letter-spacing="8">TECNOLOGIA E DESENVOLVIMENTO</text>
  <path d="M378 310H920" stroke="url(#accent)" stroke-width="3" stroke-linecap="round">
    <animate attributeName="stroke-opacity" values=".45;1;.45" dur="3s" repeatCount="indefinite"/>
  </path>

  <!-- Frases alternadas automaticamente: ciclo de 12 segundos -->
  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="39" font-weight="650" fill="#FFFFFF">
    <text x="378" y="374" opacity="0">Sites profissionais que fortalecem sua marca
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;.02;.23;.25;1" values="0;1;1;0;0"/>
    </text>
    <text x="378" y="374" opacity="0">Sistemas que simplificam sua operação
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;.25;.27;.48;.5;1" values="0;0;1;1;0;0"/>
    </text>
    <text x="378" y="374" opacity="0">Landing pages que conectam e convertem
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;.5;.52;.73;.75;1" values="0;0;1;1;0;0"/>
    </text>
    <text x="378" y="374" opacity="0">Aplicações web para novas possibilidades
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;.75;.77;.98;1" values="0;0;1;1;0"/>
    </text>
  </g>
  <text x="380" y="430" fill="#B6CBE4" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="400">Sites  •  Sistemas  •  Landing pages  •  Aplicações web</text>

  <!-- Janela de código -->
  <g transform="translate(1190 185)">
    <rect x="0" y="0" width="265" height="205" rx="18" fill="#07172F" fill-opacity=".78" stroke="#4ABEFF" stroke-opacity=".45" stroke-width="2"/>
    <path d="M0 48H265" stroke="#4ABEFF" stroke-opacity=".25"/>
    <circle cx="23" cy="24" r="5" fill="#FF6B78"/>
    <circle cx="43" cy="24" r="5" fill="#FFC45C"/>
    <circle cx="63" cy="24" r="5" fill="#50D9A0"/>
    <g font-family="Consolas, 'Courier New', monospace" font-size="16">
      <text x="24" y="85" fill="#61D9FF">&lt;web&gt;</text>
      <text x="43" y="116" fill="#DCEBFF">build<span fill="#8AABCE">(</span></text>
      <text x="62" y="145" fill="#76E0B4">"your ideas"</text>
      <text x="43" y="174" fill="#DCEBFF">);</text>
      <text x="24" y="194" fill="#61D9FF">&lt;/web&gt;</text>
    </g>
  </g>

  <text x="145" y="548" fill="#8DA9C9" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" letter-spacing="3">TECNOLOGIA FEITA PARA EVOLUIR</text>
  <text x="1455" y="548" text-anchor="end" fill="#8DA9C9" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" letter-spacing="2">DAVITECH.COM.BR</text>
</svg>
